<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hirono Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- HEADER -->
    <header>
        <h1>Hirono Gallery</h1>
        <!-- navbar -->
        <nav class="navbar">
            <a href="./index.html">Home</a>
            <a href="./sida2.html">About</a>
            <a href="./sida3.html">Series</a>
            <a href="./sida4.html">Blindbox</a>
        </nav>
    </header>
    <main>
        <!-- blindbox -->
          
        <section class="blindbox">
            <h2>Blindbox</h2>
            <div class="blindbox-layout">
                <!-- LEFT -->
                <div class="blindbox-left">
                    <img class="figure-img" id="figure-img" src="./bilder/roadjournal.png" alt="blind box">
                     <h3 class="figure-name" id="figure-name">????</h3>
                       <p class="figure-rarity" id="figure-rarity">???</p>
                        <button onclick="openBox()"> Open Box</button>
                </div>
                <!-- RIGHT -->
                 <div class="blindbox-right">
                    <p class="label">Which will you get?</p>
                    <div class="grid">
                        <div class="card">
                             <img src="./bilder/birdy.png" alt="Birdy">
                             <span>Birdy</span>
                             <span>Common</span>
                        </div>
                        <div class="card">
                             <img src="./bilder/sardine.png" alt="sardine">
                             <span>Sardine</span>
                             <span>Rare</span>
                        </div>
                        <div class="card">
                             <img src="./bilder/house.png" alt="House">
                             <span>House</span>
                             <span>Secret</span>
                        </div>
                        <div class="card">
                             <img src="./bilder/snoopy.png" alt="Snoopy">
                             <span>Snoopy</span>
                             <span>ULTRA SECRET</span>
                        </div>
                    </div>
                 </div>
            </div>
        </section>
    </main>
    <!-- FOOTER -->
    <footer>
        <p>Hirono Guide | School Project</p>
    </footer>
     <script src="script.js"></script>
</body>

</html>
